.cloud, .star, .tree, .building, .bubble, .snow, .leaf, .fish {
      position: absolute;
    }

    .cloud {
      width: 170px;
      height: 48px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      filter: blur(1px);
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      width: 70px;
      height: 70px;
      left: 26px;
      bottom: 10px;
    }

    .cloud::after {
      width: 86px;
      height: 86px;
      right: 20px;
      bottom: 5px;
    }

    .star {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px #fff;
    }

    .tree {
      width: 60px;
      height: 150px;
      border-radius: 50% 50% 20% 20%;
      background: #17663c;
      box-shadow:
        0 -30px 0 10px #288852,
        18px -18px 0 4px #1c7446,
        -18px -9px 0 2px #207c4c;
    }

    .tree::after {
      content: "";
      position: absolute;
      left: 24px;
      top: 100px;
      width: 14px;
      height: 68px;
      border-radius: 8px;
      background: #5f3c24;
    }

    .building {
      width: 100px;
      height: 240px;
      bottom: 0;
      background: rgba(23,38,67,.88);
      border: 3px solid rgba(255,255,255,.08);
      box-shadow:
        22px 0 0 rgba(16,28,54,.82),
        -20px 20px 0 rgba(14,26,48,.78);
    }

    .bubble {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(255,255,255,.58);
      border-radius: 50%;
      box-shadow: inset 4px 4px 8px rgba(255,255,255,.34);
    }

    .snow {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.86);
      box-shadow: 0 0 8px rgba(255,255,255,.8);
    }

    .leaf {
      width: 22px;
      height: 12px;
      border-radius: 100% 0 100% 0;
      background: #f2a43d;
      transform: rotate(35deg);
    }

    .fish {
      font-size: 34px;
      filter: drop-shadow(0 4px 7px rgba(0,0,0,.3));

function renderScene(){const s=scenes[current];background.style.background=s.background;decorateScene(s.decor);$('icon').textContent=s.icon;$('sentence').textContent=s.description;$('counter').textContent=(current+1)+' / '+scenes.length;}
$('prev').onclick=()=>{current=(current+24)%25;renderScene();};$('next').onclick=()=>{current=(current+1)%25;renderScene();};$('random').onclick=()=>{current=(current+1+Math.floor(Math.random()*24))%25;renderScene();};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();});$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){status(e.message);}};
let statusTimer;function status(t,error=false){clearTimeout(statusTimer);$('status').textContent=t;if(!error)statusTimer=setTimeout(()=>{$('status').textContent='';},6500);}
const streams={A:null,B:null},models={A:null,B:null},contexts={A:$('canvasA').getContext('2d'),B:$('canvasB').getContext('2d')};let epoch=0,busy=false,library=null,working=false;const failed={A:false,B:false};
function loadLibrary(){if(library)return library;library=new Promise((resolve,reject)=>{const script=document.createElement('script');const timer=setTimeout(()=>reject(Error('A háttéreltávolító modul betöltése túl sokáig tart.')),25000);script.src='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js';script.onload=()=>{clearTimeout(timer);if(typeof SelfieSegmentation==='undefined')reject(Error('A háttéreltávolító modul nem érhető el.'));else resolve();};script.onerror=()=>{clearTimeout(timer);reject(Error('A háttéreltávolító modul nem töltődött be. Internetkapcsolat szükséges.'));};document.head.appendChild(script);}).catch(e=>{library=null;throw e;});return library;}
async function ensureModel(k){if(models[k])return models[k];await loadLibrary();const model=new SelfieSegmentation({locateFile:file=>'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/'+file});model.setOptions({modelSelection:1,selfieMode:false});model.onResults(results=>{if(!streams[k])return;const c=contexts[k],canvas=$('canvas'+k);c.save();c.clearRect(0,0,canvas.width,canvas.height);if(results.segmentationMask){c.drawImage(results.segmentationMask,0,0,canvas.width,canvas.height);c.globalCompositeOperation='source-in';}c.drawImage(results.image,0,0,canvas.width,canvas.height);c.restore();});await model.initialize();models[k]=model;return model;}
function stop(){epoch++;busy=false;for(const k of ['A','B']){if(streams[k])streams[k].getTracks().forEach(t=>t.stop());streams[k]=null;$('video'+k).srcObject=null;contexts[k].clearRect(0,0,640,480);$('name'+k).textContent='';}status('Leállítva.');}
async function open(k){if(busy){status('Kameranyitás folyamatban.');return;}busy=true;const n=epoch;let incoming=null,accepted=false;status('Kamera megnyitása…');const timer=setTimeout(()=>{if(n===epoch)status('A böngésző kameraengedélyére várunk.',true);},15000);try{if(!navigator.mediaDevices)throw Error('A kamera API nem érhető el.');incoming=await navigator.mediaDevices.getUserMedia({audio:false,video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:15}}});if(n!==epoch)return;clearTimeout(timer);const t=incoming.getVideoTracks()[0],id=t.getSettings().deviceId,other=streams[k==='A'?'B':'A'];if(other&&id&&id===other.getVideoTracks()[0].getSettings().deviceId)throw Error('Ugyanaz a kamera. Válaszd a másik eszközt a böngészőben.');if(streams[k])streams[k].getTracks().forEach(t=>t.stop());streams[k]=incoming;accepted=true;failed[k]=false;$('video'+k).srcObject=incoming;$('video'+k).play().catch(e=>status(e.message,true));$('name'+k).textContent=t.label;status('Automatikus háttéreltávolítás betöltése…');await ensureModel(k);if(n===epoch)status('');}catch(e){if(n===epoch)status(e.message,true);}finally{clearTimeout(timer);if(incoming&&!accepted)incoming.getTracks().forEach(t=>t.stop());if(n===epoch)busy=false;}}
$('openA').onclick=()=>open('A');$('openB').onclick=()=>open('B');$('stop').onclick=stop;window.addEventListener('pagehide',stop);
async function process(){if(!working){working=true;try{for(const k of ['A','B']){const v=$('video'+k);if(!streams[k]||v.readyState<2)continue;if(models[k]&&!failed[k]){try{await models[k].send({image:v});}catch(e){failed[k]=true;status('Háttéreltávolítási hiba: '+e.message,true);}}else{const c=contexts[k];c.clearRect(0,0,640,480);c.drawImage(v,0,0,640,480);}}}finally{working=false;}}setTimeout(process,65);}renderScene();process();
</script></html>
