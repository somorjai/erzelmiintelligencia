<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangra Potyogó Virágok</title>

  <style>
    :root {
      --level: 0;
      --hue: 120;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: Arial, "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
      background: #06130b;
      color: #ffffff;
    }

    body {
      min-height: 100vh;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at 50% 32%,
          hsl(var(--hue) 85% 28% / calc(0.10 + var(--level) * 0.34)),
          transparent calc(22% + var(--level) * 24%)
        ),
        linear-gradient(
          180deg,
          hsl(var(--hue) 42% 11%),
          hsl(calc(var(--hue) - 18) 42% 6%)
        );
      transition: background 150ms linear;
    }

    .sky-glow {
      position: absolute;
      inset: 0;
      z-index: -5;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% -15%,
          hsl(var(--hue) 95% 60% / calc(0.10 + var(--level) * 0.35)),
          transparent 52%
        );
    }

    .ground {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -22vh;
      height: 39vh;
      z-index: -4;
      border-radius: 50% 50% 0 0;
      background:
        radial-gradient(
          ellipse at 50% 10%,
          hsl(var(--hue) 72% 36% / 0.68),
          hsl(calc(var(--hue) - 22) 52% 12%) 56%,
          #030805 100%
        );
      box-shadow:
        0 -20px 70px hsl(var(--hue) 90% 52% / calc(0.08 + var(--level) * 0.22));
      transform: scaleY(calc(0.92 + var(--level) * 0.12));
      transition: transform 150ms ease-out;
    }

    .ground::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: calc(0.22 + var(--level) * 0.20);
      background-image:
        radial-gradient(
          circle,
          hsl(var(--hue) 90% 62% / 0.44) 0 1px,
          transparent 1.7px
        );
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, #000, transparent 75%);
    }

    .rain-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .flower {
      position: absolute;
      top: -22vh;
      left: 50%;
      width: 1em;
      height: 1em;
      display: grid;
      place-items: center;
      line-height: 1;
      user-select: none;
      will-change: transform, opacity, filter;
      font-size: var(--flower-size);
      filter:
        hue-rotate(var(--flower-hue))
        saturate(calc(0.8 + var(--level) * 1.7))
        drop-shadow(0 8px 12px rgba(0, 0, 0, 0.42));
      animation:
        flower-fall var(--fall-duration) cubic-bezier(0.22, 0.72, 0.38, 1)
        forwards;
    }

    .flower::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 91%;
      width: 72%;
      height: 14%;
      border-radius: 50%;
      z-index: -1;
      opacity: 0.55;
      background: rgba(0, 0, 0, 0.38);
      filter: blur(5px);
      transform: translateX(-50%);
      animation: flower-shadow var(--fall-duration) ease-in forwards;
    }

    .meter-card {
      position: fixed;
      left: 50%;
      bottom: 7%;
      z-index: 10;
      width: min(82vw, 560px);
      transform: translateX(-50%);
      padding: 14px 16px 13px;
      border: 1px solid hsl(var(--hue) 85% 70% / 0.28);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.34);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(10px);
    }

    .meter-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: baseline;
    }

    .level-number {
      font-size: clamp(1.45rem, 3.3vw, 2.3rem);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .level-label {
      font-size: clamp(0.72rem, 1.3vw, 0.92rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.88;
      text-align: right;
    }

    .meter-track {
      width: 100%;
      height: 14px;
      margin-top: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.36);
    }

    .meter-fill {
      width: calc(var(--level) * 100%);
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          #39cf67 0%,
          #dce34f 44%,
          #ffb237 68%,
          #f43f35 100%
        );
      box-shadow:
        0 0 16px hsl(var(--hue) 100% 58% / 0.88);
      transition: width 70ms linear;
    }

    .scale {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.70);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .start-panel {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(2, 10, 5, 0.78);
      backdrop-filter: blur(10px);
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    .start-panel.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-card {
      width: min(92vw, 440px);
      padding: 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.12),
          rgba(0, 0, 0, 0.24)
        );
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.42);
    }

    .start-card .flower-icon {
      font-size: 64px;
      line-height: 1;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.4));
    }

    .start-card h1 {
      margin: 16px 0 8px;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }

    .start-card p {
      margin: 0 0 22px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.95rem;
    }

    .start-button {
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      background:
        linear-gradient(135deg, #2dbd58, #d7c643, #e64136);
      box-shadow:
        0 8px 25px rgba(58, 208, 91, 0.30);
      transition: transform 150ms ease, filter 150ms ease;
    }

    .start-button:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.1);
    }

    .start-button:active {
      transform: translateY(0) scale(0.99);
    }

    .status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 12;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      color: #dbe9df;
      background: rgba(0, 0, 0, 0.46);
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    .status.connected {
      color: #aaffbb;
      border-color: rgba(118, 255, 152, 0.38);
    }

    .status.error {
      color: #ffb5aa;
      border-color: rgba(255, 100, 85, 0.42);
    }

    @keyframes flower-fall {
      0% {
        opacity: 0;
        transform:
          translate3d(calc(var(--start-x) * 1vw), -18vh, 0)
          rotate(var(--start-rotate))
          scale(0.70);
      }

      8% {
        opacity: 1;
      }

      80% {
        opacity: 1;
        transform:
          translate3d(calc(var(--end-x) * 1vw), 80vh, 0)
          rotate(var(--end-rotate))
          scale(1);
      }

      100% {
        opacity: 0;
        transform:
          translate3d(calc(var(--end-x) * 1vw), 95vh, 0)
          rotate(var(--end-rotate))
          scale(0.87);
      }
    }

    @keyframes flower-shadow {
      0% {
        opacity: 0;
        transform: translateX(-50%) scale(0.2);
      }

      78% {
        opacity: 0.50;
        transform: translateX(-50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateX(-50%) scale(1.25);
      }
    }

    @media (max-width: 620px) {
      .meter-card {
        bottom: 9%;
      }

      .status {
        left: 10px;
        bottom: 10px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flower,
      .flower::after {
        animation-duration: 0.01ms !important;
      }

      * {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="stage" id="stage">
    <div class="sky-glow"></div>
    <div class="ground"></div>

    <div
      class="rain-layer"
      id="rainLayer"
      aria-label="Hangra megjelenő virágok"
    ></div>

    <section class="meter-card" aria-label="Hangerőmérő">
      <div class="meter-top">
        <div class="level-number" id="levelNumber">0%</div>
        <div class="level-label" id="levelLabel">Csend</div>
      </div>

      <div class="meter-track">
        <div class="meter-fill"></div>
      </div>

      <div class="scale">
        <span>Halk</span>
        <span>Közepes</span>
        <span>Hangos</span>
      </div>
    </section>
  </main>

  <div class="status" id="status">
    Mikrofon: nincs elindítva
  </div>

  <div class="start-panel" id="startPanel">
    <section class="start-card">
      <div class="flower-icon">🌸</div>
      <h1>Hangra Potyogó Virágok</h1>
      <p>
        Engedélyezd a Windows mikrofon használatát.
        Halk hangra kicsi, zöldes; erős hangra nagy, pirosabb virágok hullanak.
      </p>
      <button class="start-button" id="startButton" type="button">
        Mikrofon indítása
      </button>
    </section>
  </div>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const rainLayer = document.getElementById('rainLayer');
      const statusBox = document.getElementById('status');
      const levelNumber = document.getElementById('levelNumber');
      const levelLabel = document.getElementById('levelLabel');
      const startPanel = document.getElementById('startPanel');
      const startButton = document.getElementById('startButton');

      const flowers = [
        '🌸', '🌼', '🌺', '🌻', '🌷',
        '🌹', '💐', '🏵️', '🪷', '🪻'
      ];

      let audioContext = null;
      let analyser = null;
      let microphoneStream = null;
      let timeDomainData = null;

      let rawLevel = 0;
      let displayLevel = 0;
      let lastSpawnTime = 0;
      let microphoneStarted = false;

      function clamp(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
      }

      function randomBetween(minimum, maximum) {
        return Math.random() * (maximum - minimum) + minimum;
      }

      function randomItem(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function setStatus(text, state) {
        statusBox.textContent = text;
        statusBox.className = 'status';

        if (state) {
          statusBox.classList.add(state);
        }
      }

      function levelToHue(level) {
        /*
          Halk: zöldes árnyalat.
          Közepes: sárga.
          Hangos: piros.
        */
        return Math.round(120 - level * 120);
      }

      function levelToLabel(level) {
        if (level < 0.04) return 'Csend';
        if (level < 0.15) return 'Halk: kis virágok';
        if (level < 0.35) return 'Közepes: virágeső';
        if (level < 0.65) return 'Erős: nagy virágok';
        return 'Nagyon hangos: piros virágzápor!';
      }

      function getFlowerSize(level) {
        /*
          Halk hang: kb. 24–42 px.
          Hangos hang: kb. 130–200 px.
        */
        const minimumSize = 24 + level * 38;
        const maximumSize = 42 + level * 158;

        return randomBetween(minimumSize, maximumSize);
      }

      function readMicrophoneLevel() {
        if (!analyser || !timeDomainData) {
          rawLevel = 0;
          return;
        }

        analyser.getByteTimeDomainData(timeDomainData);

        let sumSquares = 0;

        for (let index = 0; index < timeDomainData.length; index += 1) {
          const sample = (timeDomainData[index] - 128) / 128;
          sumSquares += sample * sample;
        }

        const rms = Math.sqrt(sumSquares / timeDomainData.length);

        /*
          A beszédhang RMS értéke alacsony.
          A négyzetgyökös erősítés láthatóvá teszi a halk hangokat is.
        */
        let boosted = Math.sqrt(rms) * 4.5;

        if (boosted < 0.018) {
          boosted = 0;
        }

        rawLevel = clamp(boosted, 0, 1);
      }

      function createFlower(level) {
        const flower = document.createElement('span');
        const flowerSize = getFlowerSize(level);

        const fallDuration = randomBetween(
          3.8 - level * 1.9,
          5.5 - level * 2.4
        );

        const startX = randomBetween(-47, 47);

        const endX = clamp(
          startX + randomBetween(-18 - level * 13, 18 + level * 13),
          -48,
          48
        );

        /*
          0 fok: a virág eredeti színe.
          360 fok körül: pirosas színeltolás.
        */
        const hueShift = Math.round(level * 350);

        flower.className = 'flower';
        flower.textContent = randomItem(flowers);

        flower.style.setProperty(
          '--flower-size',
          `${flowerSize}px`
        );

        flower.style.setProperty(
          '--flower-hue',
          `${hueShift}deg`
        );

        flower.style.setProperty(
          '--fall-duration',
          `${fallDuration}s`
        );

        flower.style.setProperty('--start-x', startX);
        flower.style.setProperty('--end-x', endX);

        flower.style.setProperty(
          '--start-rotate',
          `${randomBetween(-38, 38)}deg`
        );

        flower.style.setProperty(
          '--end-rotate',
          `${randomBetween(-220, 220)}deg`
        );

        rainLayer.appendChild(flower);

        window.setTimeout(() => {
          flower.remove();
        }, (fallDuration + 0.3) * 1000);
      }

      function spawnFlowers(timestamp) {
        if (displayLevel < 0.025) {
          return;
        }

        /*
          Hangosabb hangnál gyakoribb a virághullás,
          és egyszerre több virág is megjelenik.
        */
        const interval = Math.max(
          90,
          1150 - displayLevel * 1040
        );

        if (timestamp - lastSpawnTime < interval) {
          return;
        }

        const count = Math.max(
          1,
          Math.ceil(displayLevel * 5)
        );

        for (let index = 0; index < count; index += 1) {
          window.setTimeout(() => {
            createFlower(displayLevel);
          }, index * randomBetween(35, 100));
        }

        lastSpawnTime = timestamp;
      }

      function updateVisuals(timestamp) {
        readMicrophoneLevel();

        /*
          A megjelenítés simítása.
          Hangosodásra gyorsabban, halkulásra finomabban reagál.
        */
        const smoothing =
          rawLevel > displayLevel
            ? 0.30
            : 0.075;

        displayLevel +=
          (rawLevel - displayLevel) * smoothing;

        if (displayLevel < 0.002) {
          displayLevel = 0;
        }

        const hue = levelToHue(displayLevel);

        stage.style.setProperty(
          '--level',
          displayLevel.toFixed(3)
        );

        stage.style.setProperty('--hue', hue);

        levelNumber.textContent =
          `${Math.round(displayLevel * 100)}%`;

        levelLabel.textContent =
          levelToLabel(displayLevel);

        spawnFlowers(timestamp);

        window.requestAnimationFrame(updateVisuals);
      }

      async function startMicrophone() {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

          setStatus(
            'A böngésző nem támogatja a mikrofon elérését ezen az oldalon.',
            'error'
          );

          return;
        }

        startButton.disabled = true;
        startButton.textContent = 'Mikrofon engedélyezése…';

        try {
          microphoneStream =
            await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
              },
              video: false
            });

          audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

          if (audioContext.state === 'suspended') {
            await audioContext.resume();
          }

          const source =
            audioContext.createMediaStreamSource(
              microphoneStream
            );

          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.72;

          timeDomainData = new Uint8Array(
            analyser.fftSize
          );

          source.connect(analyser);

          microphoneStarted = true;

          startPanel.classList.add('hidden');

          setStatus(
            'Windows mikrofon: aktív. A virágok a hangerőre reagálnak.',
            'connected'
          );

        } catch (error) {
          console.error(error);

          let message =
            'Nem sikerült elérni a Windows mikrofont.';

          if (error.name === 'NotAllowedError') {
            message =
              'A mikrofon engedélyezése le lett tiltva a böngészőben.';
          } else if (error.name === 'NotFoundError') {
            message =
              'Nem található használható Windows mikrofon.';
          }

          setStatus(message, 'error');

          startButton.disabled = false;
          startButton.textContent = 'Mikrofon indítása';
        }
      }

      startButton.addEventListener('click', startMicrophone);

      window.addEventListener('beforeunload', () => {
        if (microphoneStream) {
          microphoneStream.getTracks().forEach((track) => {
            track.stop();
          });
        }

        if (audioContext) {
          audioContext.close();
        }
      });

      window.requestAnimationFrame(updateVisuals);
    })();
  </script>
</body>
</html>
